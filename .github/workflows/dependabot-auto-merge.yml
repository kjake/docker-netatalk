# Automatically merge Dependabot pull requests once they pass their tests.
#
# The "test" is a real build of the container image with the proposed
# dependency changes applied. The auto-merge job depends on that build, so a
# Dependabot PR is only merged when the image still builds successfully; if the
# build fails, auto-merge is skipped and the PR stays open for manual review.
#
# This is self-contained: it needs no branch-protection rules or repository
# settings, so no manual interaction is required for merges to happen.
name: Dependabot auto-merge

on: pull_request

# Dependabot-triggered runs get a read-only token by default; grant the two
# scopes needed to merge the PR and delete its branch.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Gate: build the image with the dependency update applied. Mirrors the build
  # used elsewhere in CI, on the runner's native platform for speed.
  build:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          tags: localbuild/testimage:latest
          push: false
          load: true

  # Merge only runs if the build above succeeded.
  auto-merge:
    needs: build
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
